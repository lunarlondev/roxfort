<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>VIANNE – AKASZTÓFA</title>
    <link rel="stylesheet" href="hangman.css">
</head>
<body>

<div class="hangman-wrapper">
    <h1>AKASZTÓFA</h1>

    <svg class="hangman-svg" viewBox="0 0 200 250">
        <line x1="20" y1="230" x2="180" y2="230" class="gallow"/>
        <line x1="60" y1="230" x2="60" y2="20" class="gallow"/>
        <line x1="60" y1="20" x2="130" y2="20" class="gallow"/>
        <line x1="130" y1="20" x2="130" y2="40" class="gallow"/>

        <circle cx="130" cy="60" r="18" class="part"/>
        <line x1="130" y1="78" x2="130" y2="120" class="part"/>
        <line x1="130" y1="90" x2="105" y2="105" class="part"/>
        <line x1="130" y1="90" x2="155" y2="105" class="part"/>
        <line x1="130" y1="120" x2="110" y2="155" class="part"/>
        <line x1="130" y1="120" x2="150" y2="155" class="part"/>
    </svg>

    <div class="category" id="category"></div>
    <div class="word" id="word"></div>

    <div class="hint">
        <button id="hint-btn">HINT</button>
        <span id="hint-text"></span>
    </div>

    <div class="wrong" id="wrong"></div>
    <div class="keyboard" id="keyboard"></div>

    <button class="reset" onclick="startGame()">ÚJ SZÓ</button>
</div>

<script src="hangman.js"></script>
</body>
</html>
