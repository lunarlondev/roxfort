<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<title>Spellbook</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>Varázslatok listája</h1>

<div class="filters">

<input id="kereses" placeholder="Keresés (név / hatás / magyar név)">

<select id="ev">

<option value="0">Évfolyam</option>
<option value="0">Ismeretlen</option>
<option value="1">1. év</option>
<option value="2">2. év</option>
<option value="3">3. év</option>
<option value="4">4. év</option>
<option value="5">5. év</option>
<option value="6">6. év</option>
<option value="7">7. év</option>
<option value="8">Felsőoktatás</option>
</select>

<select id="kategoria">

<option value="">Kategória</option>

<option value="curse">Ártások / rontások / átkok</option>
<option value="transfiguration">Átváltoztatások / idézések</option>
<option value="defense">Védekezések</option>
<option value="healing">Gyógyítások</option>
<option value="charm">Bűbájok</option>

</select>

<label class="checkbox">
<input type="checkbox" id="csakev">
Csak az adott év
</label>

<label class="checkbox">
<input type="checkbox" id="dark">
Fekete mágia
</label>

<label class="checkbox">
<input type="checkbox" id="custom">
Saját varázslatok
</label>

</div>

<div class="note">
Az ismeretlen évfolyam varázslatai vagy nem tanulhatóak hagyományos módon, vagy nem ismert, hogy mikor sajátíthatják el a diákok.
</div>

<div id="lista"></div>

</div>

<script src="script.js"></script>

</body>
</html>
