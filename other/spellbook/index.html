<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<title>Spellbook</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<div class="pageTitle">
Varázslatok listája
</div>

<!-- FELSŐ SZŰRŐSÁV -->

<div class="topFilters">

<input id="kereses" placeholder="Keresés (név / hatás)">

<select id="ev">
<option value="">Összes év</option>
<option value="0">Ismeretlen</option>
<option value="1">1. év</option>
<option value="2">2. év</option>
<option value="3">3. év</option>
<option value="4">4. év</option>
<option value="5">5. év</option>
<option value="6">6. év</option>
<option value="7">7. év</option>
<option value="8">Felsőoktatás</option>
</select>

<label class="yearCheckbox">
<input type="checkbox" id="csakev">
csak ez az év
</label>

<select id="kategoria">

<option value="">Minden kategória</option>
<option value="curse">Ártások / átkok</option>
<option value="transfiguration">Átváltoztatás</option>
<option value="defense">Védekezés</option>
<option value="healing">Gyógyítás</option>
<option value="charm">Bűbájok</option>
<option value="dark">Fekete mágia</option>

</select>

<select id="customMode">

<option value="hide">Saját varázslatok: rejtve</option>
<option value="show" selected>Saját varázslatok: vegyesen</option>
<option value="only">Csak saját</option>

</select>

<select id="missingMode">

<option value="hide">Hiányzó varázslatok: rejtve</option>
<option value="show" selected>Hiányzó varázslatok: vegyesen</option>
<option value="only">Csak hiányzó</option>

</select>

<button id="clearFilters">Szűrők törlése</button>

</div>


<div class="mainLayout">

<!-- SPELL LISTA -->

<div class="content">

<div id="lista"></div>

</div>


<!-- JOBB OLDALI EMOJI FILTER -->

<div class="sidebarToggle" id="toggleRight">▶</div>
<aside class="rightSidebar" id="rightSidebar">

<h1>Hatások</h1>

<div class="legend">

<h3>Elemek</h3>

<div class="legendContent">

<div data-effect="tűz">🔥</div>
<div data-effect="víz">🌊</div>
<div data-effect="jég">❄</div>
<div data-effect="villám">⚡</div>
<div data-effect="föld">⛰️</div>
<div data-effect="levegő">💨</div>
<div data-effect="fény">✨</div>
<div data-effect="sötétség">🌑</div>

</div>


<h3>Harci hatások</h3>

<div class="legendContent">

<div data-effect="robbanás">💥</div>
<div data-effect="lökés">🌬</div>
<div data-effect="kötözés">⛓</div>
<div data-effect="bénítás">🪨</div>
<div data-effect="kábítás">🌀</div>
<div data-effect="pajzs">🛡</div>
<div data-effect="vágás">🔪</div>

</div>


<h3>Mágia típusok</h3>

<div class="legendContent">

<div data-effect="vér">🩸</div>
<div data-effect="idő">⏳</div>
<div data-effect="módosítás">🌈</div>
<div data-effect="idézés">📣</div>
<div data-effect="irányítás">🎯</div>

</div>


<h3>Képességek</h3>

<div class="legendContent">

<div data-effect="mozgás">🏃</div>
<div data-effect="tárgymozgatás">🪶</div>
<div data-effect="átváltoztatás">🏆</div>
<div data-effect="láthatatlanság">👁‍🗨</div>
<div data-effect="illúzió">🎭</div>

</div>


<h3>Egyéb</h3>

<div class="legendContent">

<div data-effect="háztartásmágia">🧹</div>
<div data-effect="párbajvarázslat">⚔</div>

</div>

</div>

</aside>

</div>

<script src="script.js"></script>
<script src="sidebar.js"></script>

</body>
</html>
