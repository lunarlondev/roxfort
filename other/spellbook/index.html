<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<title>Spellbook</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app layout">

<div class="sidebarToggle" id="toggleSidebar">◀</div>

<aside class="sidebar" id="sidebar">

<h1>Szűrők</h1>

<div class="searchBar">
<input id="kereses" placeholder="Keresés (név / hatás)">
</div>

<div class="filters">

<div class="filterGroup">
<label>Évfolyam</label>
<select id="ev">
<option value="">Összes</option>
<option value="0">Ismeretlen</option>
<option value="1">1. év</option>
<option value="2">2. év</option>
<option value="3">3. év</option>
<option value="4">4. év</option>
<option value="5">5. év</option>
<option value="6">6. év</option>
<option value="7">7. év</option>
<option value="8">Felsőoktatás</option>
</select>
</div>

<div class="filterGroup">
<label>Kategória</label>
<select id="kategoria">
<option value="">Összes</option>
<option value="curse">Ártások / átkok</option>
<option value="transfiguration">Átváltoztatás</option>
<option value="defense">Védekezés</option>
<option value="healing">Gyógyítás</option>
<option value="charm">Bűbájok</option>
<option value="dark">Fekete mágia</option>
</select>
</div>

<div class="filterGroup checkboxGroup">
<label>
<input type="checkbox" id="csakev">
Csak az adott év
</label>


</div>



<div class="filterGroup">
<label>Saját varázslatok</label>
<select id="customMode">
<option value="hide">Elrejtve</option>
<option value="show" selected>Vegyesen</option>
<option value="only">Csak ezek</option>
</select>
</div>

<div class="filterGroup">
<label>Oldalon nem szereplő</label>
<select id="missingMode">
<option value="hide">Elrejtve</option>
<option value="show" selected>Vegyesen</option>
<option value="only">Csak ezek</option>
</select>
</div>

<div class="filterGroup">
<button id="clearFilters">Szűrők törlése</button>
</div>

</div>



<div class="legend">

<h3>Elemek</h3>
<div class="legendContent">
<div data-effect="tűz" title="Tűz">🔥</div>
<div data-effect="víz" title="Víz">🌊</div>
<div data-effect="jég" title="Jég">❄</div>
<div data-effect="villám" title="Villám">⚡</div>
<div data-effect="föld" title="Föld">⛰️</div>
<div data-effect="levegő" title="Levegő">💨</div>
<div data-effect="fény" title="Fény">✨</div>
<div data-effect="sötétség" title="Sötétség">🌑</div>
</div>

<h3>Harci hatások</h3>
<div class="legendContent">
<div data-effect="robbanás" title="Robbanás">💥</div>
<div data-effect="lökés" title="Lökés">🌬</div>
<div data-effect="kötözés" title="Kötözés">⛓</div>
<div data-effect="bénítás" title="Bénítás">🪨</div>
<div data-effect="kábítás" title="Kábítás">🌀</div>
<div data-effect="pajzs" title="Védekezés">🛡</div>
<div data-effect="vágás" title="Vágás">🔪</div>
</div>


<h3>Mágia típusok</h3>
<div class="legendContent">
<div data-effect="vér" title="Vér">🩸</div>
<div data-effect="idő" title="Idő">⏳</div>
<div data-effect="módosítás" title="Módosítás">🌈</div>
<div data-effect="idézés" title="Idézés">📣</div>
<div data-effect="irányítás" title="Irányítás">🎯</div>
</div>

<h3>Képességek</h3>
<div class="legendContent">
<div data-effect="mozgás" title="Mozgás">🏃</div>
<div data-effect="tárgymozgatás" title="Tárgymozgatás">🪶</div>
<div data-effect="átváltoztatás" title="Átváltoztatás">🏆</div>
<div data-effect="láthatatlanság" title="Láthatatlanság">👁‍🗨</div>
<div data-effect="illúzió" title="Illúzió">🎭</div>
</div>

<h3>Egyéb</h3>
<div class="legendContent">
<div data-effect="háztartásmágia" title="Háztartásmágia">🧹</div>
<div data-effect="párbajvarázslat" title="Párbajvarázslat">⚔</div>
</div>

</div>

</aside>


<main class="content">

<div class="pageTitle">
Varázslatok listája
</div>

<div id="lista"></div>

</main>

</div>

<script src="script.js"></script>

<script>

const btn = document.getElementById("toggleSidebar")
const sidebar = document.getElementById("sidebar")
const layout = document.querySelector(".layout")

btn.onclick = () => {

sidebar.classList.toggle("collapsed")
layout.classList.toggle("sidebarClosed")

btn.textContent =
sidebar.classList.contains("collapsed") ? "▶" : "◀"

}

</script>

</body>
</html>
