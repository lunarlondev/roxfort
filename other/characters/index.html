<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Karakterkonstelláció</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="constellation" id="constellationApp">
    <header class="constellation__header">
      <div class="constellation__title">
        <span class="constellation__sigil" aria-hidden="true">✦</span>
        <div>
          <p>character archive</p>
          <h1>Karaktereim</h1>
        </div>
      </div>
      <span class="constellation__count" id="visibleCount">0 karakter</span>
    </header>

    <nav class="filters" id="filterBar" aria-label="Karakterszűrők"></nav>

    <section class="sky" id="constellationSky" aria-label="Karakterkonstelláció">
      <svg class="sky__lines" id="constellationLines" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="sky__stars" aria-hidden="true"></div>
      <div class="sky__characters" id="characterField"></div>

      <div class="empty-state" id="emptyState" hidden>
        <span aria-hidden="true">◇</span>
        <p>Ebben a kategóriában még nincs karakter.</p>
      </div>
    </section>

    <section class="character-detail" id="characterDetail" aria-live="polite">
      <div class="character-detail__placeholder" id="detailPlaceholder">
        <span aria-hidden="true">✦</span>
        <p>Válassz egy karaktert a konstellációból.</p>
      </div>

      <article class="character-detail__card" id="detailCard" hidden>
        <div class="character-detail__portrait">
          <img id="characterImage" src="" alt="">
        </div>
        <div class="character-detail__content">
          <h2 id="characterName">Karakter neve</h2>
          <div class="character-groups" id="characterGroups"></div>
          <div class="character-links" id="characterLinks" aria-label="Karakter linkjei"></div>
        </div>
      </article>
    </section>
  </main>

  <noscript>Az oldal használatához JavaScript szükséges.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
