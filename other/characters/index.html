<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Karakterkonstelláció</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="constellation" id="constellationApp">
    <header class="constellation__header">
      <div class="constellation__title">
        <span class="constellation__sigil" aria-hidden="true">✦</span>
        <div>
          <p>character archive</p>
          <h1>Karaktereim</h1>
        </div>
      </div>
      <span class="constellation__count" id="visibleCount">0 / 0</span>
    </header>

    <nav class="filters" id="filterBar" aria-label="Karakterkategóriák"></nav>

    <section class="orbit" aria-label="Karakterválasztó">
      <div class="orbit__line" aria-hidden="true"></div>

      <button class="orbit__arrow orbit__arrow--previous" id="previousButton" type="button" aria-label="Előző karakter">
        <span aria-hidden="true">‹</span>
      </button>

      <div class="orbit__viewport" id="orbitViewport">
        <div class="orbit__track" id="characterTrack"></div>
      </div>

      <button class="orbit__arrow orbit__arrow--next" id="nextButton" type="button" aria-label="Következő karakter">
        <span aria-hidden="true">›</span>
      </button>
    </section>

    <footer class="constellation__footer">
      <span id="activeName">Válassz karaktert</span>
      <span>Kattints a portréra az adatlaphoz</span>
    </footer>

    <section class="detail-layer" id="detailLayer" hidden aria-hidden="true">
      <button class="detail-layer__backdrop" id="detailBackdrop" type="button" aria-label="Adatlap bezárása"></button>

      <article class="detail-card" id="detailCard" role="dialog" aria-modal="true" aria-labelledby="characterName">
        <button class="detail-card__close" id="closeDetailButton" type="button" aria-label="Adatlap bezárása">×</button>

        <div class="detail-card__portrait">
          <img id="characterImage" src="" alt="">
          <span class="detail-card__generation" id="characterGeneration">—</span>
        </div>

        <div class="detail-card__content">
          <div class="detail-card__eyebrow">
            <span id="characterGroup">—</span>
            <span aria-hidden="true">◆</span>
            <span id="characterKicker">—</span>
          </div>

          <h2 id="characterName">Karakter neve</h2>
          <p class="detail-card__tagline" id="characterTagline">—</p>
          <p class="detail-card__summary" id="characterSummary">—</p>

          <dl class="facts" id="characterFacts"></dl>
          <div class="character-links" id="characterLinks" aria-label="Karakter linkjei"></div>
        </div>
      </article>
    </section>

    <section class="empty-state" id="emptyState" hidden>
      <span aria-hidden="true">◇</span>
      <p>Ebben a kategóriában még nincs karakter.</p>
    </section>
  </main>

  <noscript>Az oldal használatához JavaScript szükséges.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
