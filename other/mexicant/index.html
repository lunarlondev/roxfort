<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miguel Angyalai</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Oswald:wght@400;500;600;700&family=Permanent+Marker&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* { box-sizing:border-box; }

body { margin:0; background:#151311; color:#eee4d7; font-family:'Inter',sans-serif; }

.generator { width:min(1180px,calc(100% - 30px)); margin:30px auto 70px; }

.generator-head { margin-bottom:25px; }

.generator-head h1 { margin:0; font-family:'DM Serif Display',serif; font-size:34px; font-weight:400; }

.generator-head p { margin:7px 0 0; max-width:700px; color:#92877c; font-size:13px; line-height:1.6; }

.generator-layout { display:grid; grid-template-columns:minmax(310px,1fr) 520px; gap:28px; align-items:start; }

.generator-panel { padding:22px; background:#201d1a; border:1px solid #332d28; border-radius:13px; }

.generator-section { margin-bottom:24px; }

.generator-section:last-child { margin-bottom:0; }

.generator-label { display:block; margin-bottom:7px; color:#bd9c78; font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }

.generator-input { width:100%; height:43px; padding:0 12px; border:1px solid #413831; border-radius:7px; outline:none; background:#171412; color:#eee4d7; font-family:'Inter',sans-serif; font-size:13px; transition:.2s ease; }

.generator-input:focus { border-color:#a63b2c; box-shadow:0 0 0 3px rgba(166,59,44,.13); }

.generator-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.image-inputs { display:flex; flex-direction:column; gap:9px; }

.image-field { display:flex; align-items:center; gap:9px; }

.image-number { width:30px; flex:0 0 30px; color:#b65340; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; }

.image-field .generator-input { flex:1; min-width:0; }

.character-count { margin-bottom:10px; color:#776d64; font-size:11px; }

.character-list { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }

.character-card { position:relative; min-width:0; padding:7px; border:1px solid #3b342e; border-radius:9px; background:#191614; cursor:pointer; transition:.2s ease; user-select:none; }

.character-card:hover { transform:translateY(-2px); border-color:#725345; }

.character-card.selected { border-color:#b24432; background:#2a1c18; box-shadow:0 0 0 2px rgba(178,68,50,.14); }

.character-photo { width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:6px; background:#29231f; }

.character-photo img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(.5) sepia(.12); transition:.2s ease; }

.character-card.selected .character-photo img { filter:none; }

.character-name { margin-top:7px; color:#b7aca2; font-size:10px; line-height:1.25; text-align:center; overflow-wrap:anywhere; }

.character-card.selected .character-name { color:#f2dfc8; }

.character-check { position:absolute; top:3px; right:3px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#a63b2c; color:white; font-size:12px; font-weight:700; opacity:0; transform:scale(.7); transition:.2s ease; z-index:5; }

.character-card.selected .character-check { opacity:1; transform:scale(1); }

.selected-order { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; min-height:22px; }

.selected-pill { padding:4px 7px; border-radius:20px; background:#33241f; color:#d9bba1; font-size:9px; }

.generator-actions { display:flex; gap:8px; margin-top:24px; }

.generator-button { min-height:42px; padding:0 16px; border:0; border-radius:7px; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; font-weight:700; transition:.2s ease; }

.generator-button.primary { flex:1; background:#a63b2c; color:white; }

.generator-button.primary:hover { background:#bc4937; }

.generator-button.secondary { background:#302a25; color:#b9aea4; }

.generator-button.secondary:hover { background:#3b342e; }

.preview-column { position:sticky; top:20px; }

.preview-label { margin:0 0 10px 4px; color:#776d64; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }

.preview-frame { padding:10px; overflow:hidden; border:1px solid #332d28; border-radius:13px; background:#0e0d0c; }

.preview-inner { width:500px; max-width:100%; margin:auto; }

.code-section { margin-top:28px; }

.code-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; }

.code-head span { color:#bd9c78; font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }

.copy-state { color:#7eaa84 !important; opacity:0; transition:.2s ease; }

.copy-state.show { opacity:1; }

.code-output { width:100%; height:280px; padding:15px; resize:vertical; border:1px solid #332d28; border-radius:9px; outline:none; background:#0d0c0b; color:#c6bbb0; font:11px/1.55 Consolas,Monaco,monospace; }

@media(max-width:950px) {

}

@media(max-width:520px) {
.generator-grid { grid-template-columns:1fr; }
.character-list { grid-template-columns:repeat(2,1fr); }
.generator { width:calc(100% - 16px); margin-top:15px; }
.generator-panel { padding:16px; }
}

</style>

</head>

<body>

<div>

const copyButton = document.getElementById("copyButton");

const copyState = document.getElementById("copyState");

const POST_CSS = `
.mx-wrap { width:100%; max-width:500px; margin:35px auto; position:relative; min-height:960px; color:#2b1d17; font-family:'Oswald',sans-serif; overflow:visible; isolation:isolate; }

.mx-type { position:relative; z-index:20; display:inline-block; margin:86px 0 0 96px; padding:7px 16px 6px 16px; background:#a63b2c; color:#f6dfb3; font-size:11px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase; transform:rotate(-4deg); box-shadow:5px 5px 0 #d69c45; }

.mx-photo:hover img { filter:saturate(1.08) contrast(1.03); transform:scale(1.04); }
.mx-photofill { width:100%; height:100%; background:linear-gradient(135deg,rgba(57,125,119,.86) 0%,rgba(221,180,102,.88) 48%,rgba(170,59,44,.88) 100%); opacity:.68; }
.mx-main { width:228px; height:188px; left:96px; top:24px; z-index:6; transform:rotate(2deg); clip-path:polygon(2% 5%,97% 0,100% 90%,91% 100%,5% 96%,0 17%); }
.mx-small1 { width:132px; height:148px; left:26px; top:118px; z-index:9; transform:rotate(-7deg); clip-path:polygon(6% 0,100% 7%,93% 96%,9% 100%,0 17%); }
.mx-small2 { width:108px; height:126px; right:86px; top:136px; z-index:7; transform:rotate(8deg); clip-path:polygon(0 9%,90% 0,100% 83%,83% 100%,5% 94%); }

.mx-participants { position:relative; z-index:20; margin-top:44px; min-height:220px; padding-bottom:35px; }
.mx-people { display:flex; flex-wrap:wrap; justify-content:flex-start; align-items:flex-start; gap:28px 8px; margin-top:16px; padding:0 62px 0 94px; }
.mx-person { width:74px; position:relative; flex:0 0 74px; transition:transform .28s ease; }
.mx-person:nth-child(1) { transform:rotate(-5deg); }

.mx-person:nth-child(3) { transform:rotate(6deg); }
.mx-personpic { width:74px; height:80px; overflow:hidden; background:#dfc18f; clip-path:polygon(5% 2%,95% 0,100% 89%,83% 100%,7% 94%,0 12%); box-shadow:0 7px 12px rgba(64,38,21,.25); transition:transform .28s ease; }
.mx-personpic img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(.62) sepia(.2) saturate(.72) contrast(1.08); transition:filter .3s ease,transform .3s ease; }
.mx-personname { position:absolute; left:50%; top:72px; z-index:10; min-width:88px; max-width:165px; padding:6px 8px; background:#efe0ba; color:#37241c; font-size:9px; line-height:1.08; font-weight:600; letter-spacing:.15px; text-align:center; transform:translateX(-50%); transform-origin:center top; box-shadow:2px 3px 0 rgba(123,65,37,.2); white-space:normal; word-break:normal; overflow-wrap:anywhere; opacity:.9; transition:background .28s ease,color .28s ease,box-shadow .28s ease,opacity .28s ease; }
.mx-person:hover { z-index:60; transform:translateY(-9px) rotate(0deg); }
.mx-person:hover .mx-personpic { transform:scale(1.12); }
.mx-person:hover .mx-personpic img { filter:grayscale(0) sepia(0) saturate(1.08) contrast(1.03); transform:scale(1.07); }
.mx-person:hover .mx-personname { background:#a6382b; color:#fff0cb; opacity:1; box-shadow:4px 5px 0 #d59c48; }



function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(value) {

    if (!value) {
        return "";
    }

    const months = [
        "január",
        "február",
        "március",
        "április",
        "május",
        "június",
        "július",
        "augusztus",
        "szeptember",
        "október",
        "november",
        "december"
    ];

    const parts = value.split("-");

    const year = Number(parts[0]);
    const month = Number(parts[1]);
    const day = Number(parts[2]);

    return `${year}. ${months[month - 1]} ${day}.`;

}

function splitTitle(title) {

    const words = title.trim().split(/\s+/).filter(Boolean);

    if (words.length <= 1) {
        return {
            first: words[0] || "",
            second: ""
        };
    }

    const totalLength = words.reduce((sum, word) => sum + word.length, 0);

    let currentLength = 0;
    let splitIndex = 1;
    let smallestDifference = Infinity;

    words.forEach((word, index) => {

        if (index === words.length - 1) {
            return;
        }

        currentLength += word.length;

        const difference = Math.abs(totalLength / 2 - currentLength);

        if (difference < smallestDifference) {
            smallestDifference = difference;
            splitIndex = index + 1;
        }

    });

    return {
        first: words.slice(0, splitIndex).join(" "),
        second: words.slice(splitIndex).join(" ")
    };

}

function buildGameImage(url) {

    const cleanUrl = url.trim();

    if (!cleanUrl) {
        return `<div class="mx-photofill"></div>`;
    }

    return `<img src="${escapeHtml(cleanUrl)}" alt="">`;

}

function buildPeopleHtml() {

    return selectedCharacters.map(id => {

        const character = characters.find(item => item.id === id);

        if (!character) {
            return "";
        }

        return `
<div class="mx-person">
<div class="mx-personpic">
<img src="${escapeHtml(character.image)}" alt="">
</div>
<div class="mx-personname">${escapeHtml(character.name)}</div>
</div>`;

    }).join("\n");

}

function buildForumCode() {

    const title = splitTitle(gameTitle.value);

    const titleMarkup = title.second
        ? `${escapeHtml(title.first)}<br><em>${escapeHtml(title.second)}</em>`
        : escapeHtml(title.first);

    const peopleHtml = buildPeopleHtml();

    const image1 = buildGameImage(gameImage1.value);
    const image2 = buildGameImage(gameImage2.value);
    const image3 = buildGameImage(gameImage3.value);

    return `[html]
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Oswald:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
${POST_CSS}
</style>

<div class="mx-wrap">

<div class="mx-bg"></div>

<img class="mx-quetz" src="https://i.imgur.com/pNLYMVj.png" alt="">
<img class="mx-stamp" src="https://i.imgur.com/jhW3XqE.png" alt="">
<img class="mx-chili" src="https://i.imgur.com/jL47B7a.png" alt="">

<div class="mx-type">${escapeHtml(gameCategory.value)}</div>

<div class="mx-collage">

<div class="mx-photo mx-main">
${image1}
</div>

<div class="mx-photo mx-small1">
${image2}
</div>

<div class="mx-photo mx-small2">
${image3}
</div>

</div>

<div class="mx-titlebox">
<h2 class="mx-title">${titleMarkup}</h2>
</div>

<div class="mx-chapter">${escapeHtml(gameSubtitle.value)}</div>

<div class="mx-info">

<div class="mx-infoitem">
<span class="mx-label">Dátum</span>
<span class="mx-value">${escapeHtml(formatDate(gameDate.value))}</span>
</div>

<div class="mx-infoitem">
<span class="mx-label">Helyszín</span>
<span class="mx-value">${escapeHtml(gameLocation.value)}</span>
</div>

</div>

<div class="mx-participants">

<div class="mx-parttitle">Résztvevők</div>

<div class="mx-people">
${peopleHtml}
</div>

<div class="mx-footmark"></div>

</div>

</div>
[/html]`;

}

function updatePreview() {

    const code = buildForumCode();

    codeOutput.value = code;

    const previewCode = code
        .replace(/^\[html\]/, "")
        .replace(/\[\/html\]$/, "");

    preview.innerHTML = previewCode;

}

function renderCharacters() {

    characterList.innerHTML = "";

    characters.forEach(character => {

        const selected = selectedCharacters.includes(character.id);

        const card = document.createElement("div");

        card.className = `character-card${selected ? " selected" : ""}`;

        card.innerHTML = `
            <div class="character-check">✓</div>

            <div class="character-photo">
                <img src="${escapeHtml(character.image)}" alt="${escapeHtml(character.name)}">
            </div>

            <div class="character-name">${escapeHtml(character.name)}</div>
        `;

        card.addEventListener("click", () => {
            toggleCharacter(character.id);
        });

        characterList.appendChild(card);

    });

    if (selectedCharacters.length === 0) {
        characterCount.textContent = "Nincs kiválasztott résztvevő";
    } else {
        characterCount.textContent = `${selectedCharacters.length} résztvevő kiválasztva`;
    }

    selectedOrder.innerHTML = selectedCharacters.map(id => {

        const character = characters.find(item => item.id === id);

        if (!character) {
            return "";
        }

        return `<span class="selected-pill">${escapeHtml(character.name)}</span>`;

    }).join("");

}

function toggleCharacter(id) {

    const index = selectedCharacters.indexOf(id);

    if (index >= 0) {
        selectedCharacters.splice(index, 1);
    } else {
        selectedCharacters.push(id);
    }

    renderCharacters();
    updatePreview();

}

function resetGenerator() {

    gameTitle.value = "Elveszett útvonalak";
    gameSubtitle.value = "Nincs több menekülés";
    gameCategory.value = "Közjáték";
    gameDate.value = "2026-08-17";
    gameLocation.value = "London, Anglia";

    gameImage1.value = "";
    gameImage2.value = "";
    gameImage3.value = "";

    selectedCharacters = [];

    renderCharacters();
    updatePreview();

}

async function copyCode() {

    const code = codeOutput.value;

    try {

        await navigator.clipboard.writeText(code);

    } catch {

        codeOutput.focus();
        codeOutput.select();

        document.execCommand("copy");

    }

    copyState.classList.add("show");

    window.setTimeout(() => {
        copyState.classList.remove("show");
    }, 1800);

}

async function loadCharacters() {

    try {

        const response = await fetch("characters.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("characters.json nem tölthető be.");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("A characters.json nem tömb.");
        }

        characters = data;

    } catch (error) {

        console.warn("A characters.json nem érhető el, fallback karakterlista használata.", error);

        characters = FALLBACK_CHARACTERS;

    }

    renderCharacters();
    updatePreview();

}

[
    gameTitle,
    gameSubtitle,
    gameCategory,
    gameDate,
    gameLocation,
    gameImage1,
    gameImage2,
    gameImage3
].forEach(element => {

    element.addEventListener("input", updatePreview);
    element.addEventListener("change", updatePreview);

});

copyButton.addEventListener("click", copyCode);
resetButton.addEventListener("click", resetGenerator);

loadCharacters();

</script>
