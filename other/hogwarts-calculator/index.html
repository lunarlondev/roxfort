<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Roxfort évfolyam kalkulátor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-labelledby="calculator-title">
    <header class="calculator__header">
      <h1 id="calculator-title">Roxfort évfolyam kalkulátor</h1>
      <p>Válaszd ki a karakter születési dátumát és a vizsgált tanévet.</p>
    </header>

    <form class="form" novalidate>
      <div class="field">
        <label for="birthDate">Születési dátum</label>
        <input id="birthDate" name="birthDate" type="date" autocomplete="bday" required>
      </div>

      <div class="field">
        <label for="schoolYear">Tanév</label>
        <input
          id="schoolYear"
          name="schoolYear"
          type="text"
          inputmode="numeric"
          value="2006/2007"
          placeholder="pl. 2006/2007"
          pattern="^[0-9]{4}\/[0-9]{4}$"
          required
        >
        <small>Formátum: ÉÉÉÉ/ÉÉÉÉ</small>
      </div>
    </form>

    <section class="result" aria-live="polite" aria-atomic="true">
      <p class="result__label">Eredmény</p>
      <p id="resultText" class="result__text">Adj meg egy születési dátumot.</p>
      <p id="resultDetails" class="result__details"></p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
