<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Hívj meg egy italra</title>
<link rel="stylesheet" href="./gemma.css">
</head>
<body>

<div class="gemmaApp">

  <!-- KAPCSOLAT -->
  <div class="gemmaCard">
    <div class="gemmaTitle">Kapcsolatok</div>
    <div class="gemmaTabs">
      <button data-cat="friend" class="active">Barát</button>
      <button data-cat="family">Család</button>
      <button data-cat="enemy">Ellenség</button>
      <button data-cat="love">Szerelem</button>
      <button data-cat="other">Egyéb</button>
    </div>
    <div class="relationBox" id="relationBox"></div>
  </div>

  <!-- ITALOK -->
  <div class="gemmaCard">
    <div class="gemmaTitle">Hívj meg egy italra!</div>
    <div class="barShelf" id="barShelf"></div>
  </div>

  <!-- KÓDGENERÁLÁS -->
  <div class="gemmaCard">
    <div class="gemmaTitle">Amit nekem mondanál</div>

    <div class="genGrid">
      <input id="title" placeholder="Cím">
      <textarea id="text" placeholder="Leírás"></textarea>

      <div class="genPreview">
        <div class="genDrink" id="previewDrink"></div>
        <div class="genText">
          <div class="genTitle" id="previewTitle">Cím</div>
          <div class="genBody" id="previewText">Leírás</div>
        </div>
      </div>

      <button id="generate">Kód generálása</button>
      <textarea id="output" readonly></textarea>
    </div>
  </div>

</div>

<script src="./gemma.js"></script>
</body>
</html>
