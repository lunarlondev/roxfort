<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hazelkkny.css">
</head>
<body>

<div class="hk-wrap">
  <img class="hk-cat" id="cat" src="https://i.imgur.com/4DeVeoz.png" alt="">

  <div class="hk-card">

    <div class="hk-menu">
      <button data-view="friends">barátok</button>
      <button data-view="enemies">ellenségek</button>
      <button data-view="loves">szerelmek</button>
      <button data-view="other">egyéb</button>
    </div>

    <div class="hk-view">
  <div class="hk-hero">
    <img id="vImg" alt="">
    <div class="hk-hero-overlay">
      <div class="hk-hero-mode" id="vMode"></div>
      <div class="hk-hero-quote" id="vQuote"></div>
    </div>
  </div>
  <div class="hk-title" id="vTitle"></div>
</div>

    <div class="hk-form">
      <input id="msgTitle" placeholder="Cím">
      <textarea id="msgBody" rows="4" placeholder="Üzenet"></textarea>
    </div>

    <div class="hk-broccoli">
      <img id="broccoli" src="https://i.imgur.com/F6z4UjA.png" alt="">
    </div>

    <pre class="hk-code" id="code"></pre>

  </div>
</div>

<script src="hazelkkny.js"></script>
</body>
</html>
