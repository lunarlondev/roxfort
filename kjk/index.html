<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Story Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div id="game">
        <div id="text" class="text"></div>
        <div id="choices" class="choices"></div>
    </div>

    <div class="controls">
        <button id="backBtn">Vissza</button>
        <button id="restartBtn">Újrakezdés</button>
    </div>

    <div id="endingScreen" class="hidden">
        <div class="endingTitle" id="endingTitle"></div>
        <div class="endingText" id="endingText"></div>

        <div class="timelineTitle">Útvonalad</div>
        <div id="timeline" class="timeline"></div>

        <div class="timelineTitle">Nem választott utak</div>
        <div id="missed" class="missed"></div>
    </div>
</div>

<script src="engine.js"></script>
</body>
</html>
