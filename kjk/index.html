<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/timeline.css">

<title>Story Engine</title>
</head>
<body>

<div class="wrapper">

    <div id="storyContainer" class="storyContainer"></div>


    <div class="controls">
        <button id="backBtn">Vissza</button>
        <button id="restartBtn">Újrakezdés</button>
    </div>

<div id="endingOverlay" class="endingOverlay hidden">
    <div class="endingCard">

        <div id="endingTitle" class="endingTitle"></div>
        <div id="endingText" class="endingText"></div>

        <div class="endingStats">
            <div id="endingId"></div>
            <div id="endingCount"></div>
        </div>

        <div class="endingButtons">
            <button id="restartEndingBtn">Újrakezdés</button>
        </div>

    </div>
</div>


</div>

<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
