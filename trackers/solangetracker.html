<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solange Laveau - játékkövető</title>
  <link rel="stylesheet" href="solangetracker.css">
</head>
<body>
  <main class="solangetracker-sheet" id="top">
    <header class="solangetracker-hero">
      <div class="solangetracker-hero-inner">
        <div class="solangetracker-sigil">
          <img id="solangetrackerHeroImage" src="https://lunarlondev.github.io/roxfort/solange/images/snake2.jpg" alt="">
        </div>

        <div class="solangetracker-hero-text">
          <h1 id="solangetrackerTitle">Solange Laveau</h1>
          <div class="solangetracker-subtitle" id="solangetrackerSubtitle">játékkövető</div>
        </div>
      </div>

      <div class="solangetracker-intro" id="solangetrackerIntro">
        Játékaim listája.
      </div>
    </header>

    <section class="solangetracker-card">
      <div class="solangetracker-section-head">
        <h2>Játékok</h2>
        <div class="solangetracker-count" id="solangetrackerVisibleCount">0 játék</div>
      </div>

      <div class="solangetracker-ornament">
        <div class="solangetracker-ornament-line"></div>
        <div class="solangetracker-ornament-mark"></div>
        <div class="solangetracker-ornament-line"></div>
      </div>

      <div class="solangetracker-tools">
        <input class="solangetracker-search" id="solangetrackerSearch" type="search" placeholder="Keresés címre, szereplőre, témára, tagre...">

        <div class="solangetracker-filterbar" aria-label="Szűrők">
          <button class="solangetracker-btn solangetracker-filter is-active" type="button" data-filter="all">Összes</button>
          <button class="solangetracker-btn solangetracker-filter" type="button" data-filter="active">Aktív</button>
          <button class="solangetracker-btn solangetracker-filter" type="button" data-filter="closed">Lezárt</button>
        </div>

        <div class="solangetracker-actions">
          <button class="solangetracker-btn" id="solangetrackerOpenAll" type="button">Mind nyit</button>
          <button class="solangetracker-btn solangetracker-subtle" id="solangetrackerCloseAll" type="button">Mind zár</button>
        </div>
      </div>

      <div class="solangetracker-stats" id="solangetrackerStats"></div>

      <div class="solangetracker-scrollbox" id="solangetrackerScrollbox">
  <div class="solangetracker-reader solangetracker-hidden" id="solangetrackerReader"></div>

  <div class="solangetracker-list" id="solangetrackerList"></div>

  <div class="solangetracker-empty solangetracker-hidden" id="solangetrackerEmpty">
    Nincs találat erre a szűrésre.
  </div>
</div>
    </section>
  </main>

  <script src="solangetracker.js"></script>
</body>
</html>
